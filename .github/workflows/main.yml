name: CI/CD IOUGURT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-cd-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TEST_DB_USER: iougurt
  TEST_DB_PASSWORD: iougurt
  TEST_DB_NAME: iougurt_test
  TEST_JWT_SECRET: test-jwt-secret
  NODE_VERSION: '20'

jobs:
  lint-e-testes:
    name: Linter, Testes e Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iougurt
          POSTGRES_PASSWORD: iougurt
          POSTGRES_DB: iougurt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Rodar Typecheck
        run: npm run typecheck

      - name: Aplicar migrations no container Postgres
        env:
          DATABASE_URL: postgresql://iougurt:iougurt@localhost:5432/iougurt_test?schema=public
        run: npx prisma migrate deploy

      - name: Rodar Testes com Coverage
        env:
          DATABASE_URL: postgresql://iougurt:iougurt@localhost:5432/iougurt_test?schema=public
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
        run: npm run test:coverage

      - name: Rodar testes de integração com PostgreSQL real
        env:
          DATABASE_URL: postgresql://iougurt:iougurt@localhost:5432/iougurt_test?schema=public
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
          VITEST_REAL_DB: 'true'
        run: npm run test:real-db

      - name: Upload do relatório de Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build-docker:
    name: Build da Imagem Docker
    needs: lint-e-testes
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validar credenciais do Docker Hub em push na main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "Erro: DOCKERHUB_USERNAME e DOCKERHUB_TOKEN são obrigatórios para publicação na main."
            exit 1
          fi

      - name: Definir tags da imagem
        id: meta
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            IMAGE="${DOCKERHUB_USERNAME}/iougurt-api"
          else
            IMAGE="iougurt/iougurt-api"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build e Push (target prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy em Produção via SSH (WEB-04)
    needs: build-docker
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Validar secrets e variáveis obrigatórias de deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || secrets.PROD_BASE_URL }}
        run: |
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY PROD_BASE_URL; do
            if [ -z "${!var}" ]; then
              echo "Erro: secret/variável ${var} não configurada no environment production."
              exit 1
            fi
          done

      - name: Deploy atômico na VPS via SSH
        uses: appleboy/ssh-action@v1.1.0
        env:
          API_IMAGE_TAG: ${{ needs.build-docker.outputs.sha_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: API_IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            cd ~/app/iougurt

            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            fi

            PREV_IMAGE="$(docker inspect --format='{{.Config.Image}}' iougurt-api 2>/dev/null || true)"
            TARGET_TAG="${API_IMAGE_TAG:-latest}"

            echo "Baixando imagem da API (tag: ${TARGET_TAG})..."
            API_IMAGE_TAG="$TARGET_TAG" docker compose pull api

            rollback() {
              echo "Falha ao subir a nova versão da API. Logs recentes:"
              docker compose logs --tail=80 api || true
              if [ -n "$PREV_IMAGE" ]; then
                PREV_TAG="${PREV_IMAGE##*:}"
                echo "Executando rollback para ${PREV_IMAGE}..."
                API_IMAGE_TAG="$PREV_TAG" docker compose up -d --wait --wait-timeout 90 --no-deps api || true
              fi
              exit 1
            }

            trap rollback ERR

            API_IMAGE_TAG="$TARGET_TAG" docker compose up -d --wait --wait-timeout 90 --no-deps api
            docker compose exec -T api wget -qO- http://127.0.0.1:3000/health/ready

            trap - ERR

            if [ -f .env ]; then
              if grep -q '^API_IMAGE_TAG=' .env; then
                sed -i "s/^API_IMAGE_TAG=.*/API_IMAGE_TAG=${TARGET_TAG}/" .env
              else
                echo "API_IMAGE_TAG=${TARGET_TAG}" >> .env
              fi
            fi

            docker image prune -f

      - name: Checkout para executar Smoke Check externo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validação pós-deploy da API em Produção (WEB-05 Camada 1)
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || secrets.PROD_BASE_URL }}
          PROD_SMOKE_OWNER_EMAIL: ${{ secrets.PROD_SMOKE_OWNER_EMAIL }}
          PROD_SMOKE_OWNER_PASSWORD: ${{ secrets.PROD_SMOKE_OWNER_PASSWORD }}
          EXPECT_SWAGGER_DISABLED: ${{ vars.EXPECT_SWAGGER_DISABLED || 'true' }}
          SMOKE_REQUIRE_CREDENTIALS: ${{ vars.SMOKE_REQUIRE_CREDENTIALS || 'false' }}
        run: node scripts/smoke-prod-api.mjs
