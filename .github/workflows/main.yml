name: CI/CD IOUGURT

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-e-testes:
    name: Linter e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iougurt
          POSTGRES_PASSWORD: iougurt
          POSTGRES_DB: iougurt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar Linter (Typecheck)
        run: npm run typecheck

      - name: Rodar Testes
        env:
          DATABASE_URL: postgresql://iougurt:iougurt@localhost:5432/iougurt_test?schema=public
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
        run: |
          npx prisma generate
          npx vitest run

  build-docker:
    name: Build e Push da Imagem Docker
    needs: lint-e-testes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/iougurt-api:latest

  deploy:
    name: Deploy para o Servidor
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Aviso de Deploy
        run: echo "Deploy pausado. Configure o servidor e descomente as linhas no main.yml quando estiver pronto."

