services:
  db:
    image: postgres:16-alpine
    container_name: iougurt-db
    restart: unless-stopped
    networks:
      - iougurt
    environment:
      POSTGRES_USER: iougurt
      POSTGRES_PASSWORD: iougurt
      POSTGRES_DB: iougurt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iougurt -d iougurt"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: dev
    container_name: iougurt-api
    restart: unless-stopped
    networks:
      - iougurt
    env_file:
      - .env
    ports:
      - "3001:3000"
    volumes:
      # O bind mount abaixo já faz os uploads (exames e fotos de pacientes)
      # caírem em ./uploads na máquina do desenvolvedor, então em dev eles
      # sobrevivem a restart e recriação do container.
      #
      # ATENÇÃO para quem cuida do deploy: isso NÃO vale em produção, onde não
      # há bind mount. Esses arquivos ficam em disco, não no banco, e o caminho
      # é configurável por UPLOADS_DIR. Sem um volume persistente apontado para
      # ele, todo exame e toda foto somem a cada redeploy.
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  iougurt:
    name: iougurt-shared
